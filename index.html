<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<title>Perilous 3D</title>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.185.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.185.0/examples/jsm/",
    "d3-delaunay": "https://cdn.jsdelivr.net/npm/d3-delaunay@6.0.4/+esm",
    "lil-gui": "https://unpkg.com/lil-gui@0.19.2/dist/lil-gui.esm.js",
    "simplex-noise": "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.3/+esm"
  }
}
</script>

<style>
body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; }
#container { width: 100vw; height: 100vh; position: relative; }
#progress-panel { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(255,255,255,0.85); padding: 25px 40px; border-radius: 12px; text-align: center; z-index: 20; display: none; }
#progress-title { font-size: 20px; margin: 0 0 6px; }
#progress-step { font-size: 14px; color: #444; margin: 0 0 12px; }
#progress-detail { font-size: 13px; color: #333; }
#fps { position: absolute; bottom: 10px; right: 10px; z-index: 10; font-size: 13px; color: #fff; background: rgba(0,0,0,0.4); padding: 4px 10px; border-radius: 4px; }
#items-panel { position: absolute; top: 5px; left: 5px; z-index: 10; width: 240px; font-family: 'Trebuchet MS', Arial, sans-serif; font-size: 12px; background: #fafaf9; border: 1px solid #bbb; border-radius: 4px; box-shadow: 2px 2px 8px rgba(0,0,0,0.15); padding: 8px; }
.ip-header { font-size: 13px; font-weight: bold; color: #111; margin-bottom: 6px; }
#items-panel select { width: 100%; padding: 4px; font-size: 12px; margin-bottom: 6px; border: 1px solid #bbb; border-radius: 3px; background: #fff; color: #111; }
#ip-list { max-height: 240px; overflow-y: auto; margin-bottom: 4px; }
.ip-item { padding: 3px 5px; cursor: pointer; border-radius: 2px; color: #222; }
.ip-item:hover { background: #ddeeff; }
.ip-empty { padding: 3px 5px; color: #888; font-style: italic; }
#ip-zoomout { width: 100%; padding: 4px; font-size: 12px; border: 1px solid #bbb; border-radius: 3px; background: #fff; cursor: pointer; color: #111; }
#ip-zoomout:hover { background: #e8e8e8; }
#cell-info-tooltip { display:none; position:absolute; z-index:30; background:rgba(0,0,0,0.78); color:#fff; padding:6px 10px; border-radius:6px; font-family:Arial,sans-serif; font-size:12px; pointer-events:none; white-space:nowrap; box-shadow:0 2px 8px rgba(0,0,0,0.35); }
</style>
</head>
<body style="background: #CAE5FF">
<div id="container"></div>
<div id="progress-panel">
  <div id="progress-step"></div>
  <div id="progress-title"></div>
  <div id="progress-detail"></div>
</div>
<div id="fps">-- fps</div>
<div id="cell-info-tooltip"></div>

<script type="module" src="src/main.js"></script>
</body>
</html>
